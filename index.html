<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListaSpesa v. 1.21</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-active: #f1c40f;
      --accent-active-border: #f39c12;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e2e8f0;
      --shadow: 0 2px 5px rgba(0,0,0,0.05);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Schermata Lista Spesa completata: tutti gli articoli sono stati spuntati. */
    #main-header.summary-complete {
      background-color: #229954;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LOGO APPLICAZIONE */
    .app-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .app-logo .version {
      margin-left: 5px;
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .nav-btn {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    .nav-btn.secondary {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .nav-btn.success {
      background-color: #2ecc71;
      color: white;
    }

    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      flex: 1;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* BARRA DEI PULSANTI AMPIA E SPAZIATA */
    .action-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .action-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #4a5568;
    }

    .action-buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-item {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      padding: 6px 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .category-item.has-selected {
      background-color: #fff9db;
      border: 2px solid var(--accent-active-border);
    }

    .category-item.highlight-focus {
      animation: pulseHighlight 1.5s ease-out;
    }

    @keyframes pulseHighlight {
      0% { transform: scale(1.02); background-color: #bbeeff; box-shadow: 0 0 15px rgba(52, 152, 219, 0.7); }
      100% { transform: scale(1); box-shadow: var(--shadow); }
    }

    .seq-input {
      width: 62px;
      padding: 8px 4px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary-color);
      background-color: #f7fafc;
      margin-right: 8px;
    }

    .seq-input:focus {
      outline: none;
      border-color: var(--secondary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .cat-btn {
      flex: 1;
      background: none;
      border: none;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3748;
      padding: 10px 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-qty {
      background-color: #e2e8f0;
      color: #4a5568;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .category-item.has-selected .badge-qty {
      background-color: var(--accent-active-border);
      color: white;
    }

    .icon-action-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .icon-action-btn:hover {
      opacity: 1;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 8px 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      gap: 8px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #2d3748;
      flex: 1;
    }

    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #edf2f7;
    }

    .stepper-btn {
      background-color: #edf2f7;
      border: none;
      width: 38px;
      height: 38px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stepper-btn:active {
      background-color: #cbd5e0;
    }

    .stepper-input {
      width: 44px;
      height: 38px;
      border: none;
      border-left: 1px solid #cbd5e0;
      border-right: 1px solid #cbd5e0;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #2d3748;
    }

    .summary-group {
      margin-bottom: 16px;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .summary-header {
      background-color: #edf2f7;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-header .seq-tag {
      font-size: 0.75rem;
      background: var(--primary-color);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-item.checked {
      opacity: 0.5;
      text-decoration: line-through;
      background-color: #f7fafc;
    }

    .summary-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--secondary-color);
    }

    .summary-details {
      flex: 1;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .summary-qty {
      font-weight: 700;
      color: var(--secondary-color);
    }

    .btn-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: white;
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-bottom: 12px;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4a5568;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
      font-size: 1rem;
    }
    .cart-icon {
      display: inline-block;
      filter: grayscale(1) brightness(0) invert(1);
    }
    .app-logo {
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 6px;
      padding: 5px 8px;
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="app-logo">
      <span>ListaSpesa</span>
      <span class="version">(v. 1.21)</span>
    </div>
    <button class="nav-btn" onclick="renderScreen('summary')">
      <span class="cart-icon">🛒</span> Lista Spesa
    </button>
  </header>

  <div class="container">
    <section id="screen-categories" class="screen active">
      <div class="action-bar">
        <div class="action-buttons-grid">
          <button class="nav-btn secondary" onclick="saveExistingFile()" title="Salva sovrascrivendo il file attivo">💾 Salva</button>
          <button class="nav-btn secondary" onclick="saveAsNewFile()" title="Salva con nome in un percorso">📝 Salva con nome</button>
          <button class="nav-btn secondary" onclick="triggerImport()" title="Carica file esistente">📂 Importa</button>
          <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importData(event)">
          <button class="nav-btn success" onclick="openAddCategoryModal()">➕ Nuova Categoria</button>
        </div>
      </div>
      <div id="categories-container" class="category-list"></div>
    </section>

    <section id="screen-products" class="screen">
      <div id="products-container" class="product-list"></div>
    </section>

    <section id="screen-summary" class="screen">
      <div class="action-bar">
        <span>Percorso Ottimizzato Spesa</span>
        <button class="nav-btn secondary" onclick="clearAllQuantities()">🗑️ Svuota Lista</button>
      </div>
      <div id="summary-container"></div>
    </section>
  </div>

  <button id="btn-top" class="btn-top" onclick="scrollToTop()">⬆️</button>

  <!-- MODALE AGGIUNGI CATEGORIA -->
  <div id="modal-add-category" class="modal">
    <div class="modal-content">
      <h3>Aggiungi Nuova Categoria</h3>
      <div class="form-group">
        <label for="new-cat-name">Nome Categoria</label>
        <input type="text" id="new-cat-name" class="form-control" placeholder="Es. SURGELATI">
      </div>
      <div class="form-group">
        <label for="new-cat-seq">Numero Sequenza</label>
        <input type="number" id="new-cat-seq" class="form-control" placeholder="Es. 1500" value="1000">
      </div>
      <div class="modal-actions">
        <button class="nav-btn secondary" onclick="closeModal('modal-add-category')">Annulla</button>
        <button class="nav-btn success" onclick="saveNewCategory()">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODALE AGGIUNGI PRODOTTO -->
  <div id="modal-add-product" class="modal">
    <div class="modal-content">
      <h3>Aggiungi Nuovo Prodotto</h3>
      <div class="form-group">
        <label for="new-prod-name">Nome Prodotto</label>
        <input type="text" id="new-prod-name" class="form-control" placeholder="Es. Bastoncini di Pesce">
      </div>
      <div class="modal-actions">
        <button class="nav-btn secondary" onclick="closeModal('modal-add-product')">Annulla</button>
        <button class="nav-btn success" onclick="saveNewProduct()">Salva</button>
      </div>
    </div>
  </div>

    let appData = [];
    let currentCategoryId = null;
    let categoryScrollPosition = 0;
    let lastActiveCategoryCardId = null;
    let activeFileHandle = null; // Gestione handle per sovrascrittura diretta

    function sortProducts(products) {
      return [...products].sort((a, b) =>
        String(a.name || '').localeCompare(String(b.name || ''), 'it', { sensitivity: 'base' })
      );
    }

    function productNameKey(name) {
      return String(name || '').normalize('NFC').toLocaleLowerCase('it');
    }

    function normalizeProducts(products) {
      const uniqueProducts = new Map();
      (Array.isArray(products) ? products : [])
        .map(product => typeof product === 'string' ? { name: product, qty: 0 } : product)
        .filter(product => product && typeof product.name === 'string' && product.name.trim())
        .forEach(product => {
          const parsedQty = Number.parseInt(product.qty, 10);
          const normalized = {
            ...product,
            name: product.name.trim(),
            qty: Number.isFinite(parsedQty) && parsedQty > 0 ? parsedQty : 0
          };
          const key = productNameKey(normalized.name);
          const existing = uniqueProducts.get(key);
          if (!existing) {
            uniqueProducts.set(key, normalized);
          } else {
            const merged = {
              ...existing,
              ...normalized,
              name: existing.name,
              qty: Math.max(existing.qty || 0, normalized.qty || 0)
            };
            if (existing.checked || normalized.checked) merged.checked = true;
            else if ('checked' in existing || 'checked' in normalized) merged.checked = false;
            uniqueProducts.set(key, merged);
          }
        });
      return sortProducts([...uniqueProducts.values()]);
    }

    function buildDefaultData() {
      return DEFAULT_CATEGORIES.map(cat => ({
        id: cat.id,
        name: cat.name,
        sequence: cat.sequence,
        products: normalizeProducts(cat.items.map(item => ({ name: item, qty: 0 })))
      }));
    }

    // Chiave stabile per registrare un prodotto eliminato, limitata alla categoria.
    function makeDeletedProductKey(categoryId, productName) {
      return `${String(categoryId)}::${productNameKey(productName)}`;
    }

    // Le eliminazioni vengono salvate insieme ai dati, sia nel backup JSON sia
    // nel localStorage. In questo modo i default non ricompaiono dopo un ripristino.
    let deletedCategoryIds = new Set();
    let deletedProductKeys = new Set();

    function createBackupData() {
      return {
        format: 'ListaSpesaBackup',
        version: 2,
        categories: appData,
        deletedCategoryIds: [...deletedCategoryIds],
        deletedProductKeys: [...deletedProductKeys]
      };
    }

    // Migrazione dei vecchi backup (che erano semplici array): l'assenza di una
    // categoria o di un prodotto predefinito viene interpretata come eliminazione.
    function inferLegacyDeletions(categories) {
      const savedById = new Map(
        categories.filter(cat => cat && cat.id != null).map(cat => [String(cat.id), cat])
      );
      const inferredDeletedCategoryIds = [];
      const inferredDeletedProductKeys = [];

      DEFAULT_CATEGORIES.forEach(defaultCategory => {
        const savedCategory = savedById.get(String(defaultCategory.id));
        if (!savedCategory) {
          inferredDeletedCategoryIds.push(String(defaultCategory.id));
          return;
        }

        const savedProductNames = new Set(
          normalizeProducts(savedCategory.products).map(product => productNameKey(product.name))
        );
        defaultCategory.items.forEach(item => {
          if (!savedProductNames.has(productNameKey(item))) {
            inferredDeletedProductKeys.push(makeDeletedProductKey(defaultCategory.id, item));
          }
        });
      });

      return {
        categories,
        deletedCategoryIds: inferredDeletedCategoryIds,
        deletedProductKeys: inferredDeletedProductKeys
      };
    }

    // Accetta il nuovo backup strutturato e mantiene compatibilità con i backup
    // precedenti, che contenevano direttamente l'array delle categorie.
    function parseBackupData(data) {
      if (Array.isArray(data)) {
        return inferLegacyDeletions(data);
      }

      if (data && data.format === 'ListaSpesaBackup' && Array.isArray(data.categories)) {
        return {
          categories: data.categories,
          deletedCategoryIds: Array.isArray(data.deletedCategoryIds)
            ? data.deletedCategoryIds.map(String)
            : [],
          deletedProductKeys: Array.isArray(data.deletedProductKeys)
            ? data.deletedProductKeys.map(String)
            : []
        };
      }

      throw new Error('Formato del file di backup non valido.');
    }

    // Unisce dati salvati e prodotti predefiniti rispettando le eliminazioni registrate.
    function mergeSavedDataWithDefaults(savedData) {
      const allDefaults = buildDefaultData();
      const defaultIds = new Set(allDefaults.map(cat => String(cat.id)));
      if (!Array.isArray(savedData)) savedData = [];

      const savedById = new Map(
        savedData.filter(cat => cat && cat.id != null).map(cat => [String(cat.id), cat])
      );

      const mergedDefaults = allDefaults
        .filter(defaultCat => !deletedCategoryIds.has(String(defaultCat.id)))
        .map(defaultCat => {
          const savedCat = savedById.get(String(defaultCat.id));
          const savedProducts = normalizeProducts(savedCat && savedCat.products);
          const savedByName = new Map(savedProducts.map(product => [productNameKey(product.name), product]));
          const defaultNames = new Set(defaultCat.products.map(product => productNameKey(product.name)));

          const products = defaultCat.products
            .filter(defaultProduct => !deletedProductKeys.has(makeDeletedProductKey(defaultCat.id, defaultProduct.name)))
            .map(defaultProduct => {
              const savedProduct = savedByName.get(productNameKey(defaultProduct.name));
              return savedProduct
                ? { ...defaultProduct, ...savedProduct, name: defaultProduct.name }
                : defaultProduct;
            });

          // Mantiene prodotti personalizzati nella categoria corretta, tranne quelli eliminati.
          const customProducts = savedProducts.filter(product =>
            !defaultNames.has(productNameKey(product.name)) &&
            !deletedProductKeys.has(makeDeletedProductKey(defaultCat.id, product.name))
          );

          return {
            ...defaultCat,
            products: normalizeProducts([...products, ...customProducts])
          };
        });

      const customCategories = savedData
        .filter(cat => cat && cat.id != null &&
          !defaultIds.has(String(cat.id)) &&
          !deletedCategoryIds.has(String(cat.id)))
        .map(cat => ({
          ...cat,
          name: typeof cat.name === 'string' && cat.name.trim() ? cat.name.trim() : String(cat.id),
          sequence: Number.isFinite(Number(cat.sequence)) ? Number(cat.sequence) : 1000,
          products: normalizeProducts(cat.products).filter(product =>
            !deletedProductKeys.has(makeDeletedProductKey(cat.id, product.name))
          )
        }));

      return [...mergedDefaults, ...customCategories];
    }

    function loadData() {
      try {
        const saved = localStorage.getItem('listaSpesaData_v10');
        if (saved) {
          const parsed = parseBackupData(JSON.parse(saved));
          deletedCategoryIds = new Set(parsed.deletedCategoryIds);
          deletedProductKeys = new Set(parsed.deletedProductKeys);
          appData = mergeSavedDataWithDefaults(parsed.categories);
        } else {
          deletedCategoryIds = new Set();
          deletedProductKeys = new Set();
          appData = buildDefaultData();
        }
        saveData();
      } catch (e) {
        console.error('Errore nel caricamento dei dati:', e);
        deletedCategoryIds = new Set();
        deletedProductKeys = new Set();
        appData = buildDefaultData();
        saveData();
      }
    }

    function saveData() {
      try {
        localStorage.setItem('listaSpesaData_v10', JSON.stringify(createBackupData()));
      } catch (e) {
        console.error('Errore nel salvataggio locale:', e);
      }
    }

    // GESTIONE FILE 
    async function saveExistingFile() {
      const dataStr = JSON.stringify(createBackupData(), null, 2);
      if (activeFileHandle) {
        try {
          if (activeFileHandle.queryPermission) {
            const permission = await activeFileHandle.queryPermission({ mode: 'readwrite' });
            if (permission !== 'granted' && activeFileHandle.requestPermission) {
              const requested = await activeFileHandle.requestPermission({ mode: 'readwrite' });
              if (requested !== 'granted') { alert('Permesso di scrittura non concesso. Il file non è stato modificato.'); return; }
            }
          }
          const writable = await activeFileHandle.createWritable();
          await writable.write(dataStr);
          await writable.close();
          alert('File sovrascritto con successo!');
          return;
        } catch (err) {
          console.error('Errore durante la sovrascrittura:', err);
          alert('Impossibile sovrascrivere il file.\n\n' + (err.message || 'Errore sconosciuto.'));
          return;
        }
      }
      await saveAsNewFile();
    }

    async function saveAsNewFile() {
      const dataStr = JSON.stringify(createBackupData(), null, 2);
      if (window.showSaveFilePicker) {
        try {
          const options = { suggestedName: 'backup_listaspesa.json', types: [{ description: 'File JSON', accept: { 'application/json': ['.json'] } }] };
          const newFileHandle = await window.showSaveFilePicker(options);
          const writable = await newFileHandle.createWritable();
          await writable.write(dataStr);
          await writable.close();
          activeFileHandle = newFileHandle;
          alert('File salvato con successo!');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.error('Errore durante il salvataggio:', err);
          alert('Errore durante il salvataggio del file.\n\n' + (err.message || 'Errore sconosciuto.'));
          return;
        }
      }
      try {
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'backup_listaspesa.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error(err); alert('Errore durante il salvataggio dei dati.');
      }
    }

    async function triggerImport() {
      if (window.showOpenFilePicker) {
        try {
          const [fileHandle] = await window.showOpenFilePicker({ types: [{ description: 'File JSON', accept: { 'application/json': ['.json'] } }], multiple: false });
          const file = await fileHandle.getFile();
          const text = await file.text();
          const imported = parseBackupData(JSON.parse(text));
          deletedCategoryIds = new Set(imported.deletedCategoryIds);
          deletedProductKeys = new Set(imported.deletedProductKeys);
          activeFileHandle = fileHandle;
          appData = mergeSavedDataWithDefaults(imported.categories);
          saveData();
          renderScreen('categories');
          alert('Dati importati con successo!');
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error(err);
            activeFileHandle = null;
            alert('Errore durante l’importazione del file.\n\n' + (err.message || 'Errore sconosciuto.'));
          }
        }
        return;
      }
      document.getElementById('import-file-input').click();
    }

    function importData(event) {
      const fileReader = new FileReader();
      if (event.target.files && event.target.files[0]) {
        fileReader.readAsText(event.target.files[0], "UTF-8");
        fileReader.onload = (e) => {
          try {
            const imported = parseBackupData(JSON.parse(e.target.result));
            deletedCategoryIds = new Set(imported.deletedCategoryIds);
            deletedProductKeys = new Set(imported.deletedProductKeys);
            appData = mergeSavedDataWithDefaults(imported.categories);
            activeFileHandle = null;
            saveData();
            renderScreen('categories');
            alert("Dati importati con successo!");
          } catch (err) {
            console.error('Errore di importazione:', err);
            alert(err.message || "Errore durante la lettura del file.");
          }
          event.target.value = '';
        };
      }
    }

    function renderScreen(screenName = 'categories', categoryId = null, highlightCatId = null) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const header = document.getElementById('main-header');
      header.classList.remove('summary-complete');
    
      if (screenName === 'categories') {
        document.getElementById('screen-categories').classList.add('active');
        const totalSelected = getTotalSelectedCount();
    
        header.innerHTML = `
          <div class="app-logo">
            <span>ListaSpesa</span>
            <span class="version">(v. 1.21)</span>
          </div>
          <button class="nav-btn" onclick="renderScreen('summary')">
            <span class="cart-icon">🛒</span> Lista Spesa ${totalSelected > 0 ? `(${totalSelected})` : ''}
          </button>
        `;
    
        renderCategoriesList(highlightCatId);
    
        if (categoryScrollPosition > 0) {
          window.scrollTo({ top: categoryScrollPosition, behavior: 'instant' });
        }
    
      } else if (screenName === 'products') {
        categoryScrollPosition = window.scrollY || document.documentElement.scrollTop;
        currentCategoryId = categoryId;
        lastActiveCategoryCardId = categoryId;
    
        document.getElementById('screen-products').classList.add('active');
        const cat = appData.find(c => c.id === categoryId);
        const totalSelected = getTotalSelectedCount();
    
        header.innerHTML = `
          <button class="nav-btn secondary"
            aria-label="Torna alle categorie"
            title="Torna alle categorie"
            onclick="renderScreen('categories', null, '${cat ? cat.id : ''}')">⬅️</button>
    
          <h1>${cat ? cat.name : 'Prodotti'}</h1>
    
          <div style="display:flex; gap:6px;">
            <button class="nav-btn success" onclick="openAddProductModal()">➕</button>
            <button class="nav-btn" onclick="renderScreen('summary')">
              <span class="cart-icon">🛒</span> ${totalSelected > 0 ? `(${totalSelected})` : ''}
            </button>
          </div>
        `;
    
        renderProductsList(categoryId);
        window.scrollTo({ top: 0, behavior: 'instant' });
    
      } else if (screenName === 'summary') {
        categoryScrollPosition = window.scrollY || document.documentElement.scrollTop;
    
        document.getElementById('screen-summary').classList.add('active');
        const totalSelected = getTotalSelectedCount();
        const totalChecked = getTotalCheckedCount();
        header.classList.toggle('summary-complete', totalSelected > 0 && totalChecked === totalSelected);
    
        header.innerHTML = `
          <button class="nav-btn secondary"
            aria-label="Torna alle categorie"
            title="Torna alle categorie"
            onclick="renderScreen('categories', null, lastActiveCategoryCardId)">⬅️</button>
    
          <h1><span class="cart-icon">🛒</span> Lista Spesa (${totalChecked}/${totalSelected})</h1>
    
          <div></div>
        `;
    
        renderSummaryList();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    }

    function renderCategoriesList(highlightCatId = null) {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      const sortedCategories = [...appData].sort((a, b) => a.name.localeCompare(b.name, 'it', { sensitivity: 'base' }));

      sortedCategories.forEach(cat => {
        const selectedQty = cat.products.reduce((sum, p) => sum + (p.qty || 0), 0);
        const hasSelected = selectedQty > 0;
        const isHighlighted = highlightCatId === cat.id;

        const itemDiv = document.createElement('div');
        itemDiv.className = `category-item ${hasSelected ? 'has-selected' : ''} ${isHighlighted ? 'highlight-focus' : ''}`;
        itemDiv.id = `cat-item-${cat.id}`;

        itemDiv.innerHTML = `
          <input type="number" 
                 class="seq-input" 
                 value="${cat.sequence}" 
                 min="1" 
                 placeholder="Seq"
                 onkeyup="handleSeqKeyUp(event)"
                 onchange="updateSequence('${cat.id}', this.value)"
                 onclick="event.stopPropagation()">
          <button class="cat-btn" onclick="renderScreen('products', '${cat.id}')">
            <span>${cat.name}</span>
            <span class="badge-qty">${selectedQty}</span>
          </button>
          <button class="icon-action-btn" title="Elimina Categoria" onclick="deleteCategory('${cat.id}')">🗑️</button>
        `;

        container.appendChild(itemDiv);
      });

      if (highlightCatId) {
        setTimeout(() => {
          const el = document.getElementById(`cat-item-${highlightCatId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'instant', block: 'center' });
          }
        }, 50);
      }
    }

    function handleSeqKeyUp(event) {
      if (event.key === 'Enter' || event.keyCode === 13) {
        event.target.blur();
      }
    }

    function updateSequence(categoryId, newValue) {
      const seqVal = parseInt(newValue, 10);
      const cat = appData.find(c => c.id === categoryId);
      if (cat && !isNaN(seqVal) && seqVal > 0) {
        cat.sequence = seqVal;
        saveData();
      }
    }

    function deleteCategory(categoryId) {
      const cat = appData.find(c => String(c.id) === String(categoryId));
      if (!cat) return;

      if (confirm(`Sei sicuro di voler eliminare la categoria "${cat.name}" e tutti i suoi prodotti?`)) {
        deletedCategoryIds.add(String(categoryId));
        appData = appData.filter(c => String(c.id) !== String(categoryId));
        saveData();
        renderCategoriesList();
      }
    }

    function renderProductsList(categoryId) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      const cat = appData.find(c => c.id === categoryId);
      if (!cat || !cat.products) return;

      cat.products = normalizeProducts(cat.products);
      saveData();

      if (cat.products.length === 0) {
        container.innerHTML = `<div class="empty-msg">Nessun prodotto in questa categoria.<br>Clicca ➕ in alto per aggiungerne uno!</div>`;
        return;
      }

      cat.products.forEach((prod, index) => {
        const prodDiv = document.createElement('div');
        prodDiv.className = 'product-item';

        prodDiv.innerHTML = `
          <span class="product-name">${prod.name}</span>
          <div class="stepper">
            <button class="stepper-btn" onclick="changeQty('${categoryId}', ${index}, -1)">-</button>
            <input type="number" 
                   class="stepper-input" 
                   value="${prod.qty || 0}" 
                   min="0"
                   onkeyup="handleSeqKeyUp(event)"
                   onchange="setQty('${categoryId}', ${index}, this.value)">
            <button class="stepper-btn" onclick="changeQty('${categoryId}', ${index}, 1)">+</button>
          </div>
          <button class="icon-action-btn" title="Elimina Prodotto" onclick="deleteProduct('${categoryId}', ${index})">🗑️</button>
        `;

        container.appendChild(prodDiv);
      });
    }

    function changeQty(categoryId, prodIndex, delta) {
      const cat = appData.find(c => c.id === categoryId);
      if (cat && cat.products[prodIndex]) {
        let newQty = (cat.products[prodIndex].qty || 0) + delta;
        if (newQty < 0) newQty = 0;
        cat.products[prodIndex].qty = newQty;
        saveData();
        renderProductsList(categoryId);
        updateHeaderBadge();
      }
    }

    function setQty(categoryId, prodIndex, val) {
      const cat = appData.find(c => c.id === categoryId);
      let parsed = parseInt(val, 10);
      if (isNaN(parsed) || parsed < 0) parsed = 0;
      if (cat && cat.products[prodIndex]) {
        cat.products[prodIndex].qty = parsed;
        saveData();
        renderProductsList(categoryId);
        updateHeaderBadge();
      }
    }

    function deleteProduct(categoryId, prodIndex) {
      const cat = appData.find(c => String(c.id) === String(categoryId));
      if (!cat || !cat.products[prodIndex]) return;

      const prodName = cat.products[prodIndex].name;
      if (confirm(`Vuoi eliminare il prodotto "${prodName}"?`)) {
        deletedProductKeys.add(makeDeletedProductKey(categoryId, prodName));
        cat.products.splice(prodIndex, 1);
        saveData();
        renderProductsList(categoryId);
        updateHeaderBadge();
      }
    }

    function renderSummaryList() {
      const container = document.getElementById('summary-container');
      container.innerHTML = '';

      const activeCategories = appData.filter(cat => 
        cat.products.some(p => p.qty > 0)
      );

      if (activeCategories.length === 0) {
        container.innerHTML = `<div class="empty-msg">La lista della spesa è vuota.<br>Seleziona i prodotti nelle categorie!</div>`;
        return;
      }

      activeCategories.sort((a, b) => Number(a.sequence) - Number(b.sequence));

      activeCategories.forEach(cat => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'summary-group';

        const selectedProducts = cat.products.filter(p => p.qty > 0);

        let productsHTML = '';
        selectedProducts.forEach((prod) => {
          const isChecked = prod.checked ? 'checked' : '';
          productsHTML += `
            <div class="summary-item ${isChecked}" onclick="toggleCheckProduct('${cat.id}', '${escapeHtml(prod.name)}')">
              <input type="checkbox" class="summary-checkbox" ${isChecked} onclick="event.stopPropagation(); toggleCheckProduct('${cat.id}', '${escapeHtml(prod.name)}')">
              <div class="summary-details">
                <span>${prod.name}</span>
                <span class="summary-qty">x${prod.qty}</span>
              </div>
            </div>
          `;
        });

        groupDiv.innerHTML = `
          <div class="summary-header">
            <span>${cat.name}</span>
            <span class="seq-tag">Reparto ${cat.sequence}</span>
          </div>
          <div>${productsHTML}</div>
        `;

        container.appendChild(groupDiv);
      });
    }

    function toggleCheckProduct(catId, prodName) {
      const cat = appData.find(c => c.id === catId);
      if (cat) {
        const prod = cat.products.find(p => p.name === prodName);
        if (prod) {
          prod.checked = !prod.checked;
          saveData();
          renderSummaryList();
          updateHeaderBadge();
        }
      }
    }

    function clearAllQuantities() {
      if (confirm("Vuoi davvero azzerare tutti i prodotti selezionati nella lista spesa?")) {
        appData.forEach(cat => {
          cat.products.forEach(p => {
            p.qty = 0;
            p.checked = false;
          });
        });
    
        saveData();
        renderSummaryList();
        updateHeaderBadge();
      }
    }

    function openAddCategoryModal() {
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-seq').value = '1000';
      document.getElementById('modal-add-category').classList.add('active');
    }

    function saveNewCategory() {
      const nameInput = document.getElementById('new-cat-name').value.trim();
      const seqInput = parseInt(document.getElementById('new-cat-seq').value, 10);

      if (!nameInput) {
        alert("Inserisci un nome valido per la categoria.");
        return;
      }

      // Se l'utente reinserisce il nome di una categoria predefinita eliminata,
      // riattiva la categoria originale (con i suoi prodotti non eliminati singolarmente).
      const defaultCategory = DEFAULT_CATEGORIES.find(cat =>
        productNameKey(cat.name) === productNameKey(nameInput)
      );
      const id = defaultCategory
        ? String(defaultCategory.id)
        : nameInput.toLowerCase().replace(/[^a-z0-9]/g, '_');

      if (appData.some(c => String(c.id) === String(id))) {
        alert("Una categoria con questo nome esiste già!");
        return;
      }

      deletedCategoryIds.delete(String(id));
      const restoredProducts = defaultCategory
        ? normalizeProducts(defaultCategory.items
            .filter(item => !deletedProductKeys.has(makeDeletedProductKey(id, item)))
            .map(item => ({ name: item, qty: 0 })))
        : [];

      appData.push({
        id: id,
        name: defaultCategory ? defaultCategory.name : nameInput.toUpperCase(),
        sequence: defaultCategory ? defaultCategory.sequence : (isNaN(seqInput) ? 1000 : seqInput),
        products: restoredProducts
      });

      saveData();
      closeModal('modal-add-category');
      renderCategoriesList();
    }

    function openAddProductModal() {
      document.getElementById('new-prod-name').value = '';
      document.getElementById('modal-add-product').classList.add('active');
    }

    function saveNewProduct() {
      const nameInput = document.getElementById('new-prod-name').value.trim();

      if (!nameInput) {
        alert("Inserisci un nome valido per il prodotto.");
        return;
      }

      const cat = appData.find(c => c.id === currentCategoryId);
      if (cat) {
        if (cat.products.some(p => productNameKey(p.name) === productNameKey(nameInput))) {
          alert("Questo prodotto esiste già in questa categoria!");
          return;
        }

        // Se il prodotto era stato eliminato in precedenza, l'aggiunta esplicita
        // annulla la relativa registrazione di eliminazione.
        deletedProductKeys.delete(makeDeletedProductKey(cat.id, nameInput));
        cat.products.push({ name: nameInput, qty: 0 });
        cat.products = normalizeProducts(cat.products);
        saveData();
        closeModal('modal-add-product');
        renderProductsList(currentCategoryId);
        updateHeaderBadge();
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function getTotalSelectedCount() {
      return appData.reduce((total, cat) => {
        return total + cat.products.reduce((sub, p) => sub + ((p.qty && p.qty > 0) ? 1 : 0), 0);
      }, 0);
    }

    // Conta gli articoli della lista che sono stati spuntati, non le unità di quantità.
    function getTotalCheckedCount() {
      return appData.reduce((total, cat) => {
        return total + cat.products.reduce((sub, p) =>
          sub + ((p.qty && p.qty > 0 && p.checked) ? 1 : 0), 0);
      }, 0);
    }

    function updateHeaderBadge() {
      const totalSelected = getTotalSelectedCount();
      const header = document.getElementById('main-header');
      const activeScreen = document.querySelector('.screen.active')?.id;
    
      // Schermata Lista Spesa: aggiorna il contatore spuntati/totale e il colore della barra.
      if (activeScreen === 'screen-summary') {
        const totalChecked = getTotalCheckedCount();
        const title = header.querySelector('h1');
        header.classList.toggle('summary-complete', totalSelected > 0 && totalChecked === totalSelected);
        if (title) {
          title.innerHTML =
            `<span class="cart-icon">🛒</span> Lista Spesa (${totalChecked}/${totalSelected})`;
        }
        return;
      }
    
      // Schermate Categorie e Prodotti: aggiorna il contatore nel pulsante
      const badgeBtn = Array.from(header.querySelectorAll('.nav-btn'))
        .find(btn => btn.querySelector('.cart-icon'));
    
      if (!badgeBtn) return;
    
      const cartIcon = badgeBtn.querySelector('.cart-icon').outerHTML;
    
      if (activeScreen === 'screen-categories') {
        badgeBtn.innerHTML =
          `${cartIcon} Lista Spesa ${totalSelected > 0 ? `(${totalSelected})` : ''}`;
      } else {
        badgeBtn.innerHTML =
          `${cartIcon} ${totalSelected > 0 ? `(${totalSelected})` : ''}`;
      }
    }

    function handleScrollTopButton() {
      const btnTop = document.getElementById('btn-top');
      const isCategoriesActive = document.getElementById('screen-categories').classList.contains('active');
      
      if (isCategoriesActive && (window.scrollY || document.documentElement.scrollTop) > 300) {
        btnTop.style.display = 'flex';
      } else {
        btnTop.style.display = 'none';
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'");
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderScreen('categories');
      window.addEventListener('scroll', handleScrollTopButton);
    });
  </script>
</body>
</html>
