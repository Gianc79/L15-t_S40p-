<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListaSpesa v1.8</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-active: #f1c40f;
      --accent-active-border: #f39c12;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e2e8f0;
      --shadow: 0 2px 5px rgba(0,0,0,0.05);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-btn {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    .nav-btn.secondary {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .nav-btn.success {
      background-color: #2ecc71;
      color: white;
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      flex: 1;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-bar span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
    }

    .action-buttons-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-item {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      padding: 6px 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .category-item.has-selected {
      background-color: #fff9db;
      border: 2px solid var(--accent-active-border);
    }

    .category-item.highlight-focus {
      animation: pulseHighlight 1.5s ease-out;
    }

    @keyframes pulseHighlight {
      0% { transform: scale(1.02); background-color: #bbeeff; box-shadow: 0 0 15px rgba(52, 152, 219, 0.7); }
      100% { transform: scale(1); box-shadow: var(--shadow); }
    }

    .seq-input {
      width: 62px;
      padding: 8px 4px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary-color);
      background-color: #f7fafc;
      margin-right: 8px;
    }

    .seq-input:focus {
      outline: none;
      border-color: var(--secondary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .cat-btn {
      flex: 1;
      background: none;
      border: none;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3748;
      padding: 10px 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-qty {
      background-color: #e2e8f0;
      color: #4a5568;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .category-item.has-selected .badge-qty {
      background-color: var(--accent-active-border);
      color: white;
    }

    .icon-action-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .icon-action-btn:hover {
      opacity: 1;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 8px 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      gap: 8px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #2d3748;
      flex: 1;
    }

    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #edf2f7;
    }

    .stepper-btn {
      background-color: #edf2f7;
      border: none;
      width: 38px;
      height: 38px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stepper-btn:active {
      background-color: #cbd5e0;
    }

    .stepper-input {
      width: 44px;
      height: 38px;
      border: none;
      border-left: 1px solid #cbd5e0;
      border-right: 1px solid #cbd5e0;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #2d3748;
    }

    .summary-group {
      margin-bottom: 16px;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .summary-header {
      background-color: #edf2f7;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-header .seq-tag {
      font-size: 0.75rem;
      background: var(--primary-color);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-item.checked {
      opacity: 0.5;
      text-decoration: line-through;
      background-color: #f7fafc;
    }

    .summary-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--secondary-color);
    }

    .summary-details {
      flex: 1;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .summary-qty {
      font-weight: 700;
      color: var(--secondary-color);
    }

    .btn-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: white;
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-bottom: 12px;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4a5568;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- HEADER FISSO DIRETTAMENTE IN HTML -->
  <header id="main-header">
    <h1 id="header-title">📋 Categorie (v1.8)</h1>
    <button id="header-cart-btn" class="nav-btn" onclick="renderScreen('summary')">🛒 Lista Spesa</button>
  </header>

  <div class="container">
    <section id="screen-categories" class="screen active">
      <div class="action-bar">
        <span>Gestione Dati</span>
        <div class="action-buttons-group">
          <button class="nav-btn secondary" onclick="saveDataFile()" title="Salva backup file">💾 Salva</button>
          <button class="nav-btn secondary" onclick="triggerImport()" title="Carica backup file">📂 Importa</button>
          <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importData(event)">
          <button class="nav-btn success" onclick="openAddCategoryModal()">➕ Nuova Categoria</button>
        </div>
      </div>
      <div id="categories-container" class="category-list"></div>
    </section>

    <section id="screen-products" class="screen">
      <div id="products-container" class="product-list"></div>
    </section>

    <section id="screen-summary" class="screen">
      <div class="action-bar">
        <span>Percorso Ottimizzato Spesa</span>
        <button class="nav-btn secondary" onclick="clearAllQuantities()">🗑️ Svuota Lista</button>
      </div>
      <div id="summary-container"></div>
    </section>
  </div>

  <button id="btn-top" class="btn-top" onclick="scrollToTop()">⬆️</button>

  <!-- MODALE AGGIUNGI CATEGORIA -->
  <div id="modal-add-category" class="modal">
    <div class="modal-content">
      <h3>Aggiungi Nuova Categoria</h3>
      <div class="form-group">
        <label for="new-cat-name">Nome Categoria</label>
        <input type="text" id="new-cat-name" class="form-control" placeholder="Es. SURGELATI">
      </div>
      <div class="form-group">
        <label for="new-cat-seq">Numero Sequenza</label>
        <input type="number" id="new-cat-seq" class="form-control" placeholder="Es. 1500" value="1000">
      </div>
      <div class="modal-actions">
        <button class="nav-btn secondary" onclick="closeModal('modal-add-category')">Annulla</button>
        <button class="nav-btn success" onclick="saveNewCategory()">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODALE AGGIUNGI PRODOTTO -->
  <div id="modal-add-product" class="modal">
    <div class="modal-content">
      <h3>Aggiungi Nuovo Prodotto</h3>
      <div class="form-group">
        <label for="new-prod-name">Nome Prodotto</label>
        <input type="text" id="new-prod-name" class="form-control" placeholder="Es. Bastoncini di Pesce">
      </div>
      <div class="modal-actions">
        <button class="nav-btn secondary" onclick="closeModal('modal-add-product')">Annulla</button>
        <button class="nav-btn success" onclick="saveNewProduct()">Salva</button>
      </div>
    </div>
  </div>
